version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: classlink-db
    environment:
      POSTGRES_DB: classlink
      POSTGRES_USER: classlink_user
      POSTGRES_PASSWORD: classlink_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
